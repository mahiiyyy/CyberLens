name: Authentication integration tests
on:
  push:
    branches: [development/auth-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cyberlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d cyberlens_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://testuser:test-only-password@localhost:5432/cyberlens_test
      JWT_SECRET: test-only-signing-key-not-for-production-729
      CYBERLENS_TEST_DB: "1"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix backend
      - name: Initialize test schema
        working-directory: backend
        run: node --input-type=module -e 'import {readFile} from "node:fs/promises"; import {pool} from "./db/pool.js"; await pool.query(await readFile("./db/schema.sql","utf8")); await pool.end();'
      - run: node --test backend/tests/*.test.js
      - run: npm ci --prefix frontend --include=dev
      - run: npm run build --prefix frontend
